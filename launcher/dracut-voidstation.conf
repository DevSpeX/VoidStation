# VoidStation: Initramfs fuer jede Hardware (die SSD startet auch in einem anderen PC)
hostonly="no"
# Grafiktreiber und ihre Firmware gehoeren nicht ins Initramfs – sie laden spaeter vom System.
# Spart rund 200 MB je Kernel (wichtig fuer die 512-MB-EFI-Partition beim EFISTUB-Start).
omit_dracutmodules+=" drm plymouth "
omit_drivers+=" amdgpu radeon nouveau nova_core nova_drm i915 xe nvidia nvidia_drm nvidia_modeset nvidia_uvm "
