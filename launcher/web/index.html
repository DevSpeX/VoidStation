<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoidStation</title>
<style>
  /* Alle Masse haengen an --f (= Skalierung × Bildschirmhoehe/768) und --u (Kachelgroesse, per JS) */
  :root {
    --bg: #0e1012;
    --text: #ecebe8;
    --text-dim: rgba(236, 235, 232, 0.66);
    --text-faint: rgba(236, 235, 232, 0.45);
    --focus: #f2efe9;
    --f: 1;
    --u: 161px;
    --rows: 3;
    --gap: calc(10px * var(--f));
    --pad-x: 6vw;
    --ease: cubic-bezier(.1, .9, .2, 1);
    font-family: "Noto Sans", "Segoe UI", "DejaVu Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); user-select: none; }
  body {
    display: flex; flex-direction: column;
    background:
      radial-gradient(120vw 90vh at 15% 0%, #1b1f24 0%, transparent 60%),
      radial-gradient(90vw 80vh at 100% 100%, #14171b 0%, transparent 55%),
      var(--bg);
  }
  body.has-wall { background-size: cover; background-position: center; }
  body.has-wall::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(10,11,13,.55), rgba(10,11,13,.85)); }
  button, input { font: inherit; }

  /* ---------- Kopfzeile ---------- */
  header {
    position: relative; z-index: 1; flex: none;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw;
    padding: calc(34px * var(--f)) var(--pad-x) calc(20px * var(--f));
  }
  h1 { margin: 0; font-weight: 300; font-size: calc(52px * var(--f)); line-height: 1; }
  .who { display: flex; align-items: center; gap: calc(16px * var(--f)); }
  .who .meta { text-align: right; line-height: 1.2; }
  .who .name { font-size: calc(21px * var(--f)); font-weight: 300; }
  .who .time { font-size: calc(15px * var(--f)); color: var(--text-dim); }
  .round {
    width: calc(44px * var(--f)); height: calc(44px * var(--f));
    display: grid; place-items: center; cursor: pointer; flex: none;
    border: 1px solid rgba(255,255,255,.22); border-radius: 50%;
    background: transparent; color: var(--text); outline: none; transition: background .15s, border-color .15s;
  }
  .round svg { width: 46%; height: 46%; }
  .round.focus { background: rgba(255,255,255,.12); border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus); }

  /* ---------- Kacheln ---------- */
  .stage { position: relative; z-index: 1; flex: 1; min-height: 0; overflow: hidden; padding-bottom: var(--hint, 60px); }
  .htitle { display: flex; align-items: center; gap: calc(18px * var(--f)); min-width: 0; }
  .track { display: flex; gap: calc(var(--u) * .4); padding: 0 var(--pad-x); height: 100%; width: max-content; transition: transform .45s var(--ease); }
  .group h2 { margin: 0 0 calc(14px * var(--f)); font-weight: 400; font-size: calc(18px * var(--f)); color: var(--text-dim); letter-spacing: .02em; white-space: nowrap; }
  .grid { display: grid; grid-template-rows: repeat(var(--rows), var(--u)); grid-auto-columns: var(--u); grid-auto-flow: column dense; gap: var(--gap); }
  .tile {
    position: relative; overflow: hidden; cursor: pointer;
    background: var(--c, #2a2e33); color: var(--text); outline: none; transform: translateZ(0);
    transition: transform .18s var(--ease), box-shadow .18s, filter .18s;
    opacity: 0; animation: tileIn .6s var(--ease) forwards;
  }
  .tile::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,.07), transparent 45%, rgba(0,0,0,.18)); }
  .tile.medium { grid-column: span 1; }
  .tile.wide   { grid-column: span 2; }
  .tile.large  { grid-row: span 2; grid-column: span 2; }
  .tile.focus { box-shadow: 0 0 0 calc(3px * var(--f)) var(--bg), 0 0 0 calc(6px * var(--f)) var(--focus); transform: scale(1.03); z-index: 2; }
  .tile.pressed { transform: scale(.97); filter: brightness(.9); }
  .tile .icon { position: absolute; left: 50%; top: 42%; width: 34%; height: 34%; transform: translate(-50%, -50%); opacity: .95; }
  .tile.wide .icon { width: 18%; height: 36%; }
  .tile .icon svg { width: 100%; height: 100%; display: block; }
  .tile .label { position: absolute; left: 7%; bottom: 7%; right: 7%; font-size: calc(var(--u) * .105); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { position: absolute; right: 6%; top: 8%; font-size: calc(var(--u) * .08); color: rgba(255,255,255,.6); }
  .tile.medium .sub { display: none; }
  .tile img.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .run { position: absolute; left: 0; right: 0; bottom: 0; height: calc(4px * var(--f)); background: rgba(255,255,255,.8); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease); }
  .tile.running .run { transform: scaleX(1); }
  .tile .x { position: absolute; left: 5%; top: 7%; width: calc(var(--u) * .17); height: calc(var(--u) * .17); display: none; place-items: center; border-radius: 50%; background: rgba(0,0,0,.5); font-size: calc(var(--u) * .09); z-index: 3; }
  .tile.running.focus .x { display: grid; }
  .tile.clock { cursor: default; }
  .tile.clock .big { position: absolute; left: 7%; top: 12%; font-size: calc(var(--u) * .42); font-weight: 300; line-height: 1; }
  .tile.clock .date { position: absolute; left: 7.5%; bottom: 9%; font-size: calc(var(--u) * .1); color: var(--text-dim); }
  .tile.radio .now { position: absolute; left: 7%; right: 7%; top: 14%; display: none; }
  .tile.radio.playing .now { display: block; }
  .tile.radio.playing .icon { display: none; }
  .tile.radio .now .st { font-size: calc(var(--u) * .14); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.radio .now .ti { margin-top: 4px; font-size: calc(var(--u) * .095); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq { display: flex; gap: 3px; align-items: flex-end; height: calc(var(--u) * .1); }
  .eq i { width: 3px; background: currentColor; animation: eq 1s infinite ease-in-out; }
  .eq i:nth-child(1) { animation-delay: -.2s } .eq i:nth-child(2) { animation-delay: -.6s } .eq i:nth-child(3) { animation-delay: -.4s } .eq i:nth-child(4) { animation-delay: -.8s }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  .tile.radio .eq { position: absolute; right: 7%; bottom: 8%; display: none; }
  .tile.radio.playing .eq { display: flex; }
  @keyframes tileIn { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: none; } }

  /* ---------- Start-Animation ---------- */
  .splash { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--c); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .splash.show { opacity: 1; pointer-events: auto; }
  .splash .inner { text-align: center; }
  .splash svg { width: 16vh; height: 16vh; }
  .splash .name { margin-top: 3vh; font-size: calc(26px * var(--f)); font-weight: 300; }
  .dots { display: flex; gap: 10px; justify-content: center; margin-top: 5vh; height: 8px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--text); animation: dot 1.4s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }

  /* ---------- Unterseiten (Radio, Einstellungen) ---------- */
  .layer { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; opacity: 0; transform: translateX(4vw); transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .layer.open { display: flex; }
  .layer.shown { opacity: 1; transform: none; }
  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: calc(10px * var(--f)); padding: 0 var(--pad-x) calc(18px * var(--f)); flex: none; }
  .pill {
    display: inline-flex; align-items: center; gap: calc(8px * var(--f));
    min-height: calc(40px * var(--f)); padding: 0 calc(16px * var(--f));
    background: #22262b; color: var(--text); border: 2px solid transparent;
    font-size: calc(15px * var(--f)); cursor: pointer; outline: none; white-space: nowrap;
  }
  .pill svg { width: calc(16px * var(--f)); height: calc(16px * var(--f)); }
  .pill.focus { border-color: var(--focus); }
  .pill.on { background: #4a5260; }
  .pill.on::before { content: "✓"; }
  .pill[disabled] { opacity: .35; }
  .field {
    width: calc(280px * var(--f)); max-width: 40vw; min-height: calc(40px * var(--f)); padding: 0 calc(12px * var(--f));
    background: #1b1e22; color: var(--text); border: 2px solid #2c3035; outline: none; font-size: calc(15px * var(--f));
  }
  .field.focus, .field:focus { border-color: var(--focus); }
  .field::placeholder { color: var(--text-faint); }
  .vol { display: flex; align-items: center; gap: calc(8px * var(--f)); color: var(--text-dim); font-size: calc(14px * var(--f)); }
  .vol .meter { width: calc(120px * var(--f)); height: calc(5px * var(--f)); background: #2a2e33; }
  .vol .meter b { display: block; height: 100%; background: var(--text); width: 0; transition: width .2s; }
  .nowline { color: var(--text-dim); font-size: calc(15px * var(--f)); text-align: right; max-width: 45vw; min-width: 0; }
  .nowline strong { display: block; color: var(--text); font-weight: 400; font-size: calc(21px * var(--f)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowline span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sgrid { display: grid; grid-template-rows: repeat(var(--srows), calc(var(--u) * .8)); grid-auto-columns: calc(var(--u) * .8); grid-auto-flow: column; gap: var(--gap); }
  .station { --c: #22262b; }
  .station .logo { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); width: 40%; height: 40%; display: grid; place-items: center; }
  .station .logo img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .station .logo svg { width: 75%; height: 75%; opacity: .7; }
  .station .label { font-size: calc(var(--u) * .085); bottom: 6%; white-space: normal; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .station.playing { --c: #3b2f4f; }
  .station .star { position: absolute; right: 7%; top: 7%; font-size: calc(var(--u) * .08); color: rgba(255,255,255,.65); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--gap); max-width: 44vw; }
  .empty { color: var(--text-faint); font-size: calc(15px * var(--f)); max-width: 34vw; line-height: 1.5; margin-bottom: calc(14px * var(--f)); }

  /* Einstellungen: Spalten mit Zeilen */
  .col { display: flex; flex-direction: column; gap: calc(12px * var(--f)); max-width: 40vw; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: calc(8px * var(--f)); }
  .lbl { width: 100%; font-size: calc(14px * var(--f)); color: var(--text-faint); margin-top: calc(6px * var(--f)); }
  .info { font-size: calc(16px * var(--f)); color: var(--text-dim); line-height: 1.5; }
  .info b { color: var(--text); font-weight: 400; }
  .wifi .sig { color: var(--text-faint); font-size: .85em; }

  /* TV */
  .chan { --c: #1f2429; }
  .chan.playing { --c: #24414a; }
  .chan .q { position: absolute; left: 7%; top: 7%; font-size: calc(var(--u) * .07); color: rgba(255,255,255,.55); }
  .fchips { display: flex; flex-direction: column; gap: calc(10px * var(--f)); max-width: 42vw; }
  .fchips .row { gap: calc(8px * var(--f)); }

  /* AppCenter */
  .agrid { display: grid; grid-template-rows: repeat(var(--arows, 2), calc(var(--u) * .95)); grid-auto-columns: calc(var(--u) * 1.9); grid-auto-flow: column; gap: var(--gap); }
  .appcard { --c: #22262b; }
  .appcard .aicon { position: absolute; left: 6%; top: 10%; width: calc(var(--u) * .26); height: calc(var(--u) * .26); display: grid; place-items: center; background: var(--ac); }
  .appcard .aicon svg { width: 62%; height: 62%; }
  .appcard .aname { position: absolute; left: calc(12% + var(--u) * .26); right: 6%; top: 10%; font-size: calc(var(--u) * .105); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appcard .astate { position: absolute; left: calc(12% + var(--u) * .26); top: calc(10% + var(--u) * .13); font-size: calc(var(--u) * .07); color: var(--text-faint); }
  .appcard.inst .astate { color: #9fd3a8; }
  .appcard .adesc { position: absolute; left: 6%; right: 6%; bottom: 8%; font-size: calc(var(--u) * .072); color: var(--text-dim); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .jobband { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: #16191d; border-top: 1px solid #2a2e33; padding: calc(14px * var(--f)) var(--pad-x); display: none; }
  .jobband.show { display: block; }
  .jobband .jt { font-size: calc(17px * var(--f)); margin-bottom: 6px; display: flex; gap: 12px; align-items: center; }
  .jobband pre { margin: 0; font: calc(12.5px * var(--f))/1.35 "DejaVu Sans Mono", monospace; color: var(--text-dim); white-space: pre-wrap; max-height: calc(110px * var(--f)); overflow: hidden; }
  .spin { width: calc(14px * var(--f)); height: calc(14px * var(--f)); border: 2px solid var(--text-faint); border-top-color: var(--text); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Dialog ---------- */
  .dialog { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; background: rgba(6,7,8,.75); }
  .dialog.open { display: flex; }
  .dialog .band { width: 100%; padding: calc(36px * var(--f)) var(--pad-x); background: #1a1d21; border-top: 1px solid #2a2e33; border-bottom: 1px solid #2a2e33; }
  .dialog h3 { margin: 0 0 8px; font-weight: 300; font-size: calc(34px * var(--f)); }
  .dialog p { margin: 0 0 calc(24px * var(--f)); color: var(--text-dim); font-size: calc(16px * var(--f)); }
  .dialog .btns { display: flex; gap: calc(12px * var(--f)); flex-wrap: wrap; }
  .btn { min-width: calc(180px * var(--f)); padding: calc(12px * var(--f)) calc(20px * var(--f)); cursor: pointer; font-size: calc(17px * var(--f)); color: var(--text); background: #2a2e33; border: 2px solid transparent; outline: none; }
  .btn.danger { background: #6e2b2b; }
  .btn.focus { border-color: var(--focus); }

  .hint { position: fixed; left: var(--pad-x); right: var(--pad-x); bottom: calc(14px * var(--f)); z-index: 25; font-size: calc(14px * var(--f)); color: var(--text-faint); display: flex; flex-wrap: wrap; gap: calc(6px * var(--f)) calc(24px * var(--f)); }
  .hint b { font-weight: 600; color: rgba(236,235,232,.72); }
  .toast { position: fixed; right: var(--pad-x); bottom: calc(52px * var(--f)); z-index: 50; background: #2a2e33; padding: calc(10px * var(--f)) calc(16px * var(--f)); font-size: calc(16px * var(--f)); max-width: 60vw; opacity: 0; transform: translateY(10px); transition: all .25s; }
  .toast.show { opacity: 1; transform: none; }
  .toast.err { background: #6e2b2b; }

  @media (prefers-reduced-motion: reduce) { .tile { animation: none; opacity: 1; } .track, .tile, .splash, .layer { transition: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Start</h1>
  <div class="who">
    <div class="meta"><div class="name" id="user"></div><div class="time" id="hdrTime"></div></div>
    <button class="round nav" id="power" aria-label="Ausschalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
  </div>
</header>
<div class="stage" id="home"><div class="track" id="track"></div></div>

<!-- Radio -->
<section class="layer" id="radio">
  <header><div class="htitle"><button class="round rnav" data-act="back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Radio</h1></div><div class="nowline" id="rNow"></div></header>
  <div class="bar">
    <button class="pill rnav" id="rStop" data-act="stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>Stopp</button>
    <button class="pill rnav" id="rFav" data-act="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>Favorit</span></button>
    <input class="field rnav" id="rSearch" type="text" placeholder="Sender suchen …" autocomplete="off" spellcheck="false">
    <div class="vol"><button class="pill rnav" data-act="voldown">−</button><div class="meter"><b class="volbar"></b></div><button class="pill rnav" data-act="volup">+</button><span class="voltxt"></span></div>
  </div>
  <div class="stage"><div class="track" id="rTrack"></div></div>
</section>

<!-- Fernsehen -->
<section class="layer" id="tv">
  <header><div class="htitle"><button class="round tnav" data-act="back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Fernsehen</h1></div><div class="nowline" id="tNow"></div></header>
  <div class="bar">
    <input class="field tnav" id="tSearch" type="text" placeholder="Sender suchen …" autocomplete="off" spellcheck="false">
    <button class="pill tnav" id="tStop" data-act="tvstop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>Stopp</button>
    <div class="vol"><button class="pill tnav" data-act="voldown">−</button><div class="meter"><b class="volbar"></b></div><button class="pill tnav" data-act="volup">+</button><span class="voltxt"></span></div>
  </div>
  <div class="stage"><div class="track" id="tTrack"></div></div>
</section>

<!-- AppCenter -->
<section class="layer" id="apps">
  <header><div class="htitle"><button class="round anav" data-act="back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>AppCenter</h1></div><div class="nowline" id="aNow"></div></header>
  <div class="bar">
    <button class="pill anav" data-act="checkupd">Nach Updates suchen</button>
    <button class="pill anav" data-act="doupd" id="aUpd">Alles aktualisieren</button>
  </div>
  <div class="stage"><div class="track" id="aTrack"></div></div>
</section>
<div class="jobband" id="job"><div class="jt"><div class="spin" id="jobSpin"></div><span id="jobTitle"></span></div><pre id="jobLog"></pre></div>

<!-- App-Dialog -->
<div class="dialog" id="adlg" role="dialog" aria-modal="true">
  <div class="band"><h3 id="adTitle"></h3><p id="adText"></p><div class="btns" id="adBtns"></div></div>
</div>

<!-- Einstellungen -->
<section class="layer" id="settings">
  <header><div class="htitle"><button class="round snav" data-act="back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Einstellungen</h1></div><div class="nowline" id="sNet"></div></header>
  <div class="stage"><div class="track" id="sTrack"></div></div>
</section>

<div class="hint" id="hint"></div>
<div class="splash" id="splash"><div class="inner"><div id="splashIcon"></div><div class="name" id="splashName"></div><div class="dots"><i></i><i></i><i></i></div></div></div>

<div class="dialog" id="dialog" role="dialog" aria-modal="true">
  <div class="band">
    <h3>Ausschalten</h3>
    <p>Offene Programme werden vorher geschlossen.</p>
    <div class="btns">
      <button class="btn danger dnav" data-power="poweroff">Herunterfahren</button>
      <button class="btn dnav" data-power="reboot">Neu starten</button>
      <button class="btn dnav" data-close>Abbrechen</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================ Symbole */
const ICONS = {
  play:     '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="5" y="10" width="38" height="28" rx="7"/><path d="M20 17.5v13l11-6.5z" fill="currentColor"/></svg>',
  film:     '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="6" y="9" width="36" height="30" rx="3"/><path d="M14 9v30M34 9v30M6 17h8M6 24h8M6 31h8M34 17h8M34 24h8M34 31h8"/></svg>',
  handheld: '<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M14 5h36c6 0 11 5 11 12v6c0 7-5 12-11 12H14C8 35 3 30 3 23v-6C3 10 8 5 14 5z"/><rect x="20" y="11" width="24" height="18" rx="2"/><path d="M10 20h6M13 17v6"/><circle cx="51" cy="18" r="1.8" fill="currentColor"/><circle cx="55" cy="23" r="1.8" fill="currentColor"/></svg>',

/* ============================================================ Skalierung
   f = Skalierung × Hoehe/768. Kacheln wachsen mit, die Zeilenzahl passt sich an (3 → 2 → 1). */
function layout() {
  const r = innerHeight / 768;
  const f = scale * r;
  const root = document.documentElement.style;
  root.setProperty('--f', f);
  root.setProperty('--hint', ($('#hint').offsetHeight + 22 * f) + 'px');
  const stage = $('#home');
  const h2 = stage.querySelector('.group h2');
  const avail = stage.clientHeight - parseFloat(getComputedStyle(stage).paddingBottom) - (h2 ? h2.offsetHeight + parseFloat(getComputedStyle(h2).marginBottom) : 0);
  const gap = 10 * f;
  const want = 161 * r * (1 + (scale - 1) * 0.55);
  let rows = 3, u = want;
  for (rows = 3; rows >= 1; rows--) {
    const fit = (avail - gap * (rows - 1)) / rows;
    if (rows === 1 || fit >= want * 0.82) { u = Math.min(want, fit); break; }
  }
  root.setProperty('--u', Math.max(60, u) + 'px');
  root.setProperty('--rows', rows);
  root.setProperty('--srows', Math.max(1, Math.min(3, rows)));
  fitGrids();
  if (focusEl) setFocus(focusEl, true);
}
// Zeilenzahl der Raster in Radio/TV/AppCenter an den Platz ueber der Hinweiszeile anpassen
function fitGrid(track, sel, max) {
  const g = track && track.querySelector(sel);
  if (!g) return;
  track.style.removeProperty('--u');                 // erst mit normaler Kachelgroesse messen
  const gt = g.getBoundingClientRect().top;
  const hintEl = $('#hint');
  const limit = hintEl.getBoundingClientRect().top + (parseFloat(getComputedStyle(hintEl).paddingTop) || 0);
  if (!gt || limit <= gt) return;                    // Ebene gerade unsichtbar
  const cs = getComputedStyle(g);
  const cell = parseFloat(cs.gridTemplateRows.split(' ')[0]);
  const gap = parseFloat(cs.rowGap) || 0;
  if (!cell) return;
  const avail = limit - gt - 4;
  let n = Math.min(max, Math.floor((avail + gap) / (cell + gap))), k = 1;
  if (n < max) {                                     // eine Reihe mehr, wenn die Kacheln dafuer hoechstens 15 % kleiner werden
    const k2 = (avail - n * gap) / ((n + 1) * cell);
    if (k2 >= 0.85) { n += 1; k = Math.min(1, k2); }
  }
  if (n < 1) { n = 1; k = avail / cell; }            // selbst eine Reihe zu hoch: Kacheln hier kleiner
  track.style.setProperty(sel === '.agrid' ? '--arows' : '--srows', n);
  const u = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 0;
  if (k < 1 && u) track.style.setProperty('--u', (u * k) + 'px');
}
function fitGrids() {
  fitGrid($('#aTrack'), '.agrid', 3);
  fitGrid($('#tTrack'), '.sgrid', 3);
  fitGrid($('#rTrack'), '.sgrid', 3);
}

/* ============================================================ Fokus & Navigation */
function setFocus(el, instant) {
  if (!el) return;
  $$('.focus').forEach(e => e.classList.remove('focus'));
  el.classList.add('focus');
  focusEl = el;
  lastFocus[layer()] = el;
  const tr = el.closest('.track');
  if (tr) keepVisible(tr, el, instant);
}
function keepVisible(track, el, instant) {
  const box = track.parentElement.getBoundingClientRect();
  const cur = Number(track.dataset.x || 0);
  const r = el.getBoundingClientRect();
  const margin = innerWidth * 0.06;
  let x = cur;
  if (r.right > box.right - margin) x = cur - (r.right - (box.right - margin));
  if (r.left < box.left + margin) x = cur + ((box.left + margin) - r.left);
  const max = Math.max(0, track.scrollWidth - innerWidth);
  x = Math.max(-max, Math.min(0, x));
  if (instant) { track.style.transition = 'none'; requestAnimationFrame(() => track.style.transition = ''); }
  track.dataset.x = x;
  track.style.transform = `translateX(${x}px)`;
}
function move(dir) {
  const items = navItems();
  if (!focusEl || !items.includes(focusEl)) return setFocus(items[0]);
  const a = focusEl.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of items) {
    if (el === focusEl) continue;
    if (el.id === 'power' && dir !== 'up') continue;
    const b = el.getBoundingClientRect();
    const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const dx = bx - ax, dy = by - ay;
    let main, side;
    if (dir === 'left')  { if (b.right > a.left + 1) continue; main = -dx; side = Math.abs(dy); }
    if (dir === 'right') { if (b.left < a.right - 1) continue; main = dx;  side = Math.abs(dy); }
    if (dir === 'up')    { if (b.bottom > a.top + 1) continue; main = -dy; side = Math.abs(dx); }
    if (dir === 'down')  { if (b.top < a.bottom - 1) continue; main = dy;  side = Math.abs(dx); }
    const score = main + side * 2.2;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) setFocus(best);
}

function activate(el = focusEl) {
  if (!el) return;
  const act = el.dataset.act;
  if (el.id === 'power') return openDialog();
  if (el.dataset.close !== undefined) return closeDialog();
  if (el.dataset.power) return power(el.dataset.power);
  if (act === 'back') return closeLayer();
  if (act === 'stop') return radioStop();
  if (act === 'fav') return toggleFav();
  if (act === 'volup') return volume('up');
  if (act === 'voldown') return volume('down');
  if (act === 'mute') return volume('mute');
  if (el.tagName === 'INPUT') return el.focus();
  if (el.dataset.query) { $('#rSearch').value = el.dataset.query; return search(el.dataset.query); }
  if (el._station) return radioPlay(el._station);
  if (el._set) return el._set();
  if (el._tile?.type === 'radio') return openLayer('radio');
  if (el._tile?.type === 'settings') return openLayer('settings');
  if (el._tile?.type === 'tv') return openLayer('tv');
  if (el._tile?.type === 'apps') return openLayer('apps');
  if (act === 'tvstop') return tvStop();
  if (act === 'checkupd') return jobStart('check');
  if (act === 'doupd') return confirmUpdate();
  if (el._chan) return tvPlay(el._chan);
  if (el._flt) return el._flt();
  if (el._app) return appDialog(el._app);
  if (el._ad) return el._ad();
  if (el._tile) return launch(el._tile, el);
}
function back() {
  const l = layer();
  if (l === 'adlg') closeAdlg();
  else if (l === 'dialog') closeDialog();

  else if (l === 'radio' && results) { results = null; $('#rSearch').value = ''; renderStations(); }
  else if (l === 'settings' && wifiPick) { wifiPick = null; renderSettings(); }
  else if (l !== 'home') closeLayer();
}
function secondary() {
  const l = layer();

    const t = focusEl._tile;
    if (running.includes(t.id)) closeApp(t);
    else if (t.cmd) toast(`${t.label} ist gerade nicht geöffnet`);
    else toast('Diese Kachel lässt sich nicht schließen');

  if (l === 'radio' && focusEl?._station) toggleFav(focusEl._station);

}

/* ============================================================ Programme */
let launching = false, splashTimer;
async function launch(t, el) {
  if (launching || (!t.cmd && !offline)) return;
  const already = running.includes(t.id);
  el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 150);
  if (!already) showSplash(t);
  launching = true;
  try { const r = await api('/api/launch/' + encodeURIComponent(t.id)); if (r.running) setRunning(r.running); }
  catch { toast('Konnte ' + (t.label || 'Programm') + ' nicht starten', true); hideSplash(); }
  setTimeout(() => { launching = false; }, 600);
  // Wenn das Programm nach 4 s nicht (mehr) läuft, ist es beim Start abgestürzt
  if (!already && !offline) setTimeout(async () => {
    try { const s = await getJSON('/api/status'); setRunning(s.running || []);
      if (!running.includes(t.id)) { hideSplash(); toast(`${t.label} hat sich sofort wieder beendet – Details in logs/${t.id}.log`, true); } } catch {}
  }, 4000);
}
function showSplash(t) {
  const sp = $('#splash');

  $('#splashIcon').innerHTML = ICONS[t.icon] || '';

}

async function closeApp(t) {

  if (id === 'apps') loadApps();

  const first = { radio: $('#rTrack .station.playing') || $('#rTrack .rnav'), settings: $('#sTrack .snav'), tv: $('#tTrack .chan'), apps: $('#aTrack .appcard') }[id];
  setFocus(keep || first || $(`#${id} ${SCOPE[id]}`), true);

/* ============================================================ Radio */
function stationTile(st, i) {
  const el = document.createElement('div');
  el.className = 'tile medium station rnav';

  el._station = st;
  const isFav = favs.some(f => f.url === st.url);

  const img = el.querySelector('img');
  if (img) img.onerror = () => { img.parentElement.innerHTML = ICONS.radio; };
  if (radioState.station && radioState.station.url === st.url) el.classList.add('playing');
  return el;
}
function section(track, title, child) {
  const s = document.createElement('section');
  s.className = 'group';

function renderStations() {
  const tr = $('#rTrack');
  const keepUrl = focusEl?._station?.url;
  tr.innerHTML = ''; tr.dataset.x = 0; tr.style.transform = 'none';
  if (results) {
    const g = document.createElement('div');

    if (results.length) results.forEach((st, i) => g.appendChild(stationTile(st, i)));
    else g.textContent = 'Nichts gefunden. Anderen Namen probieren?';

  } else {
    if (favs.length) { const g = document.createElement('div'); g.className = 'sgrid'; favs.forEach((st, i) => g.appendChild(stationTile(st, i))); section(tr, 'Favoriten', g); }
    const chips = document.createElement('div');
    chips.className = 'chips';
    for (const q of cfg.radio_suggestions || []) { const b = document.createElement('button'); b.className = 'pill rnav'; b.dataset.query = q; b.textContent = q; chips.appendChild(b); }
    const wrap = document.createElement('div');
    if (!favs.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Noch keine Favoriten. Suche einen Sender oder wähle einen Vorschlag, dann mit „Favorit“ merken.'; wrap.appendChild(e); }
    wrap.appendChild(chips);

    $('#jobTitle').textContent = `${verb} ${jobState.name}` + (jobState.state === 'running' ? ' …' : jobState.state === 'done' ? ' – fertig' : ' – fehlgeschlagen');
    $('#jobSpin').style.display = jobState.state === 'running' ? '' : 'none';
    $('#jobLog').textContent = (jobState.log || []).slice(-6).join('\n');
    if (jobState.state !== 'running') {
      clearInterval(jobTimer);
      if (jobState.action === 'check' && jobState.result) updCount = jobState.result.updates;
      toast(jobState.state === 'done' ? `${jobState.name}: fertig${jobState.result && typeof jobState.result === 'string' ? ' – ' + jobState.result : ''}` : `${jobState.name}: fehlgeschlagen – Details im Protokoll`, jobState.state !== 'done');
      setTimeout(() => band.classList.remove('show'), jobState.state === 'done' ? 2500 : 9000);
      await load();                                   // Kacheln neu aufbauen
      if (layer() === 'apps') loadApps();
    }
  };
  tick(); jobTimer = setInterval(tick, 1000);
}

/* ============================================================ Ausschalten, Toast */
function openDialog() { $('#dialog').classList.add('open'); setFocus($('.dnav[data-close]')); updateHint(); }
function closeDialog() { $('#dialog').classList.remove('open'); const l = layer(); setFocus(lastFocus[l] || $('#power')); updateHint(); }
async function power(action) {
  if (layer() === 'dialog') closeDialog();
  toast(action === 'reboot' ? 'Neustart …' : 'Fährt herunter …');
  try { await api('/api/power/' + action); } catch { toast('Fehlgeschlagen', true); }
}
let toastT;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), err ? 5000 : 2800);
}

/* ============================================================ Eingabe: Tastatur */
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
addEventListener('keydown', e => {
  const inp = document.activeElement?.tagName === 'INPUT' ? document.activeElement : null;
  if (inp) {
    if (e.key === 'Enter') { e.preventDefault(); if (inp.id === 'rSearch') search(inp.value); else if (inp.id === 'tSearch') { tvQuery = inp.value.trim(); tvSearch(); } else if (inp.id === 'wifiPw') wifiConnect(wifiPick.ssid, inp.value); }
    else if (e.key === 'Escape') { e.preventDefault(); inp.blur(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); inp.blur(); move(KEYMAP[e.key]); }
    return;
  }
  if (KEYMAP[e.key]) { e.preventDefault(); move(KEYMAP[e.key]); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
  else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); back(); }
  else if (e.key === 'Delete' || e.key === 'Del' || e.key === 'f' || e.key === 'F' || e.key === 'y' || e.key === 'Y') { e.preventDefault(); secondary(); }
  else if (e.key === '+' || e.key === 'AudioVolumeUp') volume('up');
  else if (e.key === '-' || e.key === 'AudioVolumeDown') volume('down');
});

/* ============================================================ Eingabe: Maus */
document.addEventListener('mouseover', e => { const el = e.target.closest(SCOPE[layer()]); if (el && el !== focusEl) setFocus(el); });
document.addEventListener('click', e => {
  const x = e.target.closest('.x');
  if (x) { e.stopPropagation(); return closeApp(x.closest('.tile')._tile); }
  const el = e.target.closest(SCOPE[layer()]);
  if (el) { setFocus(el); activate(el); }
  else if (layer() === 'dialog' && e.target.id === 'dialog') closeDialog();
});
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  const t = e.target.closest('.tile');
  if (layer() === 'home' && t?._tile && running.includes(t._tile.id)) closeApp(t._tile); else back();
});
addEventListener('wheel', e => { if (layer() !== 'dialog') move((e.deltaY || e.deltaX) > 0 ? 'right' : 'left'); }, { passive: true });

/* ============================================================ Eingabe: Gamepad */
const pad = { held: {}, next: {} };
function padLoop(ts) {
  requestAnimationFrame(padLoop);
  if (document.hidden || !document.hasFocus()) { pad.held = {}; return; }
  const gps = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  const want = { left: 0, right: 0, up: 0, down: 0, a: 0, b: 0, x: 0, y: 0, start: 0, lb: 0, rb: 0 };
  for (const g of gps) {
    const bt = i => g.buttons[i] && g.buttons[i].pressed;
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    want.left ||= bt(14) || ax < -0.55; want.right ||= bt(15) || ax > 0.55;
    want.up ||= bt(12) || ay < -0.55;   want.down ||= bt(13) || ay > 0.55;
    want.a ||= bt(0); want.b ||= bt(1); want.x ||= bt(2); want.y ||= bt(3);
    want.lb ||= bt(4); want.rb ||= bt(5); want.start ||= bt(9);
  }
  for (const k of Object.keys(want)) {
    if (!want[k]) { pad.held[k] = false; continue; }
    const rep = ['left', 'right', 'up', 'down', 'lb', 'rb'].includes(k);
    if (!pad.held[k]) { pad.held[k] = true; pad.next[k] = ts + 380; fire(k); }
    else if (rep && ts >= pad.next[k]) { pad.next[k] = ts + 140; fire(k); }
  }
}
function fire(k) {
  const inInput = document.activeElement?.tagName === 'INPUT';
  if (inInput && k !== 'b') return;
  if (k === 'a') activate();
  else if (k === 'b') inInput ? document.activeElement.blur() : back();
  else if (k === 'y' || k === 'x') secondary();
  else if (k === 'lb') volume('down');
  else if (k === 'rb') volume('up');
  else if (k === 'start') layer() === 'dialog' ? closeDialog() : openDialog();
  else move(k);
}
addEventListener('gamepadconnected', e => toast('Controller verbunden: ' + e.gamepad.id.split('(')[0].trim()));
addEventListener('focus', () => { hideSplash(); poll(); });
addEventListener('resize', layout);

document.fonts?.ready.then(() => layout());
(async () => {
  try { if (!offline) scale = (await getJSON('/api/settings')).scale || 1.75; } catch {}
  document.documentElement.style.setProperty('--f', scale * innerHeight / 768);
  await loadFavs(); await load(); poll(); requestAnimationFrame(padLoop);
})();
</script>
